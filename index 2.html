.device{position:relative;height:min(820px,calc(100vh - 32px),calc(100dvh - 32px),calc((100vw - 32px)*820/390));width:auto;aspect-ratio:390/820;max-width:100%;
  border-radius:58px;padding:12px;box-sizing:border-box;

/* App view */
.view{position:absolute;inset:0;z-index:20;background:var(--app-bg);color:var(--app-fg);display:flex;flex-direction:column;direction:rtl;
  transform:scale(.6);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}

/* ========== Helpers ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const now=()=>Date.now();
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayhm=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?hm(t):(d.getDate()+'/'+(d.getMonth()+1))};
const money=(n,sg)=>'\u2066'+(sg&&n>0?'+':'')+Number(n).toLocaleString('en-US',{maximumFractionDigits:2})+'\u2069 ر.س';
const uid=()=>Math.random().toString(36).slice(2,10);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const avatar=n=>`<div class="av" style="background:hsl(${hue(n)} 50% 40%)">${esc((String(n||'?').trim()[0])||'?')}</div>`;
const meAv=sz=>S.dc&&S.dc.av?`<img src="${esc(S.dc.av)}" alt="" style="width:${sz}px;height:${sz}px;border-radius:50%;flex:none;object-fit:cover">`:avatar(me());
const empty=(t,s)=>`<div class="empty"><b>${esc(t)}</b>${esc(s)}</div>`;
const me=()=>(S.dc&&S.dc.name)||'أنا';
const cname=n=>(S.contacts.find(c=>c.num===n)||{}).name||(S.names&&S.names[n])||n;

/* ========== State ========== */
const KEY='city-phone-v2';
function defState(){const t=now();return{
 name:'',number:'',names:{},wall:0,hook:'',hidden:[],
 contacts:[],msgs:{},unread:{},calls:[],mail:[],notes:[],photos:[],memos:[],
 bal:0,lastPay:0,tx:[],cars:[],reqs:[],posts:[],cards:[],
 rooms:{'العام':[],'الشرطة':[],'الميكانيك':[]},
 cart:{},orders:[]
}}
let S;try{S=Object.assign(defState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=defState()}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('الذاكرة ممتلئة، احذف بعض الصور أو التسجيلات')}},120)}

/* ========== Discord ========== */
function hook(){return DISCORD_WEBHOOK}
function discord(content,blob){
 if(!hook())return Promise.resolve(false);
 const mk=()=>{const fd=new FormData();fd.append('payload_json',JSON.stringify({username:me()+' | جوال',avatar_url:S.dc?S.dc.av:undefined,content:String(content).slice(0,1900)}));if(blob)fd.append('files[0]',blob,'photo.jpg');return fd};
 return fetch(hook(),{method:'POST',body:mk()}).then(r=>r.ok)
  .catch(()=>fetch(hook(),{method:'POST',body:mk(),mode:'no-cors'}).then(()=>true).catch(()=>false));
}

/* ========== Shell ========== */
const V=$('#view'),VB=$('#vbody'),VF=$('#vfoot'),VT=$('#vtitle'),LY=$('#layer'),GRID=$('#grid'),DOCK=$('#dock');
let cur=null,backFn=null,cleanups=[],curThread=null,curRoom=null;
function clean(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
function page(o){clean();V.classList.toggle('bare',!!o.bare);$('#screen').classList.toggle('light',!!o.bare);curThread=null;curRoom=null;VT.textContent=o.t;VB.innerHTML=o.h||'';VB.scrollTop=0;VF.hidden=!o.f;VF.innerHTML=o.f||'';backFn=o.back||null;VB.onclick=VF.onclick=o.on||null}
function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="pane">${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeSheet()});LY.appendChild(d);return d.firstElementChild}
function closeSheet(){LY.querySelectorAll('.sheet').forEach(x=>x.remove())}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;LY.appendChild(d);setTimeout(()=>d.remove(),2300)}
function banner(k,title,text,go){LY.querySelectorAll('.banner').forEach(x=>x.remove());const d=document.createElement('button');d.className='banner';d.innerHTML=`<div class="iw"><div class="icon">${I[k]}</div></div><div style="flex:1;min-width:0"><div class="t" style="font-size:14px">${esc(title)}</div><div class="s" style="color:#d6cff0">${esc(text)}</div></div>`;d.onclick=()=>{d.remove();go&&go()};LY.appendChild(d);setTimeout(()=>d.remove(),4500);beep(880,.08,.05)}
function ask(q,yes,label='تأكيد'){const p=sheet(`<h3>${esc(q)}</h3><div class="rowx"><button class="btn red" id="y">${esc(label)}</button><button class="btn ghost" id="n">إلغاء</button></div>`);p.querySelector('#y').onclick=()=>{closeSheet();yes()};p.querySelector('#n').onclick=closeSheet}
let AC;function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(f=880,d=.15,v=.15){try{const c=actx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}

const HOME=[['mail','البريد'],['clock','الساعة'],['store','المتجر'],['settings','الإعدادات'],['notes','الملاحظات'],['maps','الخرائط'],['garage','المرآب'],['weather','الطقس'],['services','الخدمات'],['music','الموسيقى'],['voice','المذكرات الصوتية'],['calc','الآلة الحاسبة'],['chat','دورك شات'],['trendy','ترندي'],['birdy','بيردي'],['bank','البنك'],['market','السوق']];
const DOCKA=[['photos','الصور'],['camera','الكاميرا'],['messages','الرسائل'],['phone','الهاتف']];
const NAMES=Object.fromEntries([...HOME,...DOCKA]);
function badgeFor(k){if(k==='messages')return Object.values(S.unread).reduce((a,b)=>a+(b||0),0);if(k==='mail')return S.mail.filter(m=>m.box==='in'&&!m.read).length;return 0}
function iconBtn(k,n,label,extra=''){const b=badgeFor(k);return `<button class="app" data-app="${k}" aria-label="${n}"${extra}><div class="iw"><div class="icon">${I[k]}</div>${b?`<span class="badge">${b}</span>`:''}</div>${label?`<span>${n}</span>`:''}</button>`}
function renderHome(){const vis=HOME.filter(([k])=>!S.hidden.includes(k));GRID.innerHTML=vis.map(([k,n],i)=>iconBtn(k,n,1,(i===vis.length-1&&vis.length%4===1)?' style="grid-column:4"':'')).join('');DOCK.innerHTML=DOCKA.map(([k,n])=>iconBtn(k,n,0)).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b)openApp(b.dataset.app)});
function openApp(k){closeSheet();cur=k;APPS[k]();V.classList.add('open');V.setAttribute('aria-hidden','false')}
function closeApp(){clean();$('#screen').classList.remove('light');closeSheet();cur=null;curThread=null;curRoom=null;V.classList.remove('open');V.setAttribute('aria-hidden','true');renderHome()}
$('#back').onclick=()=>backFn?backFn():closeApp();
$('#homebar').onclick=closeApp;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(LY.querySelector('.sheet'))closeSheet();else closeApp()}});
function tick(){const d=new Date();$('#time').textContent=pad(d.getHours())+':'+pad(d.getMinutes())}
setInterval(tick,1000);tick();

const APPS={};
const tabs=(list,on,attr)=>`<div class="tabs">${list.map(([k,n])=>`<button ${attr}="${k}" class="${on===k?'on':''}">${n}</button>`).join('')}</div>`;

/* ========== الهاتف ========== */
let phoneTab='dial',dialNum='';
const svgPh='<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
APPS.phone=function(){setTimeout(netDot,0);
 let h=tabs([['dial','لوحة الأرقام'],['rec','الأخيرة'],['con','جهات الاتصال']],phoneTab,'data-pt');
 if(phoneTab==='dial')h+=`<div class="numdisp" id="nd">${esc(dialNum)||'&nbsp;'}</div><div class="dial">${'123456789*0#'.split('').map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button class="callb" data-dc aria-label="اتصال">${svgPh}</button></div><div style="text-align:center;margin-top:10px"><button class="link" data-bs>مسح</button> · <span class="hint" style="display:inline">رقمك: <b class="ltr" style="color:var(--app-fg);font-size:15px">${esc(S.number)}</b></span><div id="netst" style="margin-top:8px"></div></div>`;
 if(phoneTab==='rec')h+=S.calls.length?`<div class="list">${S.calls.slice(0,40).map(c=>`<button class="row" data-call="${esc(c.num)}">${avatar(cname(c.num))}<div class="main"><div class="t" style="${c.type==='miss'?'color:var(--bad)':''}">${esc(cname(c.num))}</div><div class="s">${c.type==='out'?'صادرة':c.type==='in'?'واردة':'فائتة'}</div></div><div class="meta">${dayhm(c.t)}</div></button>`).join('')}</div>`:empty('ما فيه مكالمات','المكالمات اللي تسويها تطلع هنا');
 if(phoneTab==='con')h+=`<button class="btn block" data-addc style="margin-bottom:6px">إضافة جهة اتصال</button><div class="list">${S.contacts.map(c=>`<div class="row">${avatar(c.name)}<div class="main"><div class="t">${esc(c.name)}</div><div class="s ltr">${esc(c.num)}</div></div><button class="btn sm ghost" data-msg="${esc(c.num)}">رسالة</button><button class="btn sm green" data-call="${esc(c.num)}">اتصال</button><button class="link" data-rmc="${c.id}" aria-label="حذف">✕</button></div>`).join('')}</div>`;
 page({t:'الهاتف',h,on:e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.pt){phoneTab=d.pt;APPS.phone()}
  else if(d.d){if(dialNum.length<4)dialNum+=d.d;$('#nd').textContent=dialNum;beep(600+Number(d.d||0)*40,.07,.06)}
  else if('bs' in d){dialNum=dialNum.slice(0,-1);$('#nd').innerHTML=esc(dialNum)||'&nbsp;'}
  else if('dc' in d){if(dialNum)callScreen(dialNum)}
  else if(d.call)callScreen(d.call);
  else if(d.msg){openApp('messages');thread(d.msg)}
  else if('addc' in d)addContact(()=>APPS.phone());
  else if(d.rmc)ask('حذف جهة الاتصال؟',()=>{S.contacts=S.contacts.filter(c=>c.id!==d.rmc);save();APPS.phone()},'حذف');
 }});
};
function addContact(done,num=''){const p=sheet(`<h3>جهة اتصال جديدة</h3><form class="stack" id="fc"><div><label class="lb" for="cn">الاسم</label><input class="inp" id="cn" required></div><div><label class="lb" for="cnum">الرقم</label><input class="inp ltr" id="cnum" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" title="4 أرقام" required value="${esc(num)}"></div><button class="btn">حفظ</button></form>`);
 p.querySelector('#fc').onsubmit=e=>{e.preventDefault();S.contacts.push({id:uid(),name:$('#cn').value.trim(),num:$('#cnum').value.replace(/\s/g,'')});save();closeSheet();toast('تم حفظ جهة الاتصال');done&&done()}}

APPS.messages=function(){
 const nums=Object.keys(S.msgs).filter(n=>S.msgs[n].length).sort((a,b)=>S.msgs[b].at(-1).t-S.msgs[a].at(-1).t);

 on:e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.th)thread(t.dataset.th);if('new' in t.dataset)newMsg()}});

function newMsg(){const p=sheet(`<h3>رسالة جديدة</h3><div class="list">${S.contacts.map(c=>`<button class="row" data-n="${esc(c.num)}">${avatar(c.name)}<div class="main"><div class="t">${esc(c.name)}</div><div class="s ltr">${esc(c.num)}</div></div></button>`).join('')}</div><form class="compose" id="fn" style="margin-top:12px"><input class="inp ltr" id="nn" placeholder="أو اكتب رقم (4 أرقام)" inputmode="numeric" maxlength="4"><button class="btn">فتح</button></form>`);
 p.onclick=e=>{const b=e.target.closest('[data-n]');if(b){closeSheet();thread(b.dataset.n)}};
 p.querySelector('#fn').onsubmit=e=>{e.preventDefault();const n=$('#nn').value.replace(/\s/g,'');if(n){closeSheet();thread(n)}}}
const bub=m=>`<div class="bubble ${m.me?'me':'them'}">${esc(m.x)}<time>${hm(m.t)}${m.me?(m.st==='fail'?' · ما وصلت':m.st==='wait'?' · جارٍ الإرسال':' · وصلت'):''}</time></div>`;
function thread(n){S.unread[n]=0;save();renderHome();
 page({t:cname(n),h:`<div class="thread" id="thr">${(S.msgs[n]||[]).map(bub).join('')}</div>`,f:`<form class="compose" id="cmp"><input class="inp" id="mtx" placeholder="اكتب رسالة" autocomplete="off"><button class="btn">إرسال</button></form>`,back:APPS.messages});
 curThread=n;VB.scrollTop=1e9;

/* ========== الكاميرا والصور ========== */
function shrink(src,w,h,max=900){const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
function addPhoto(d){S.photos.unshift({id:uid(),d,t:now()});if(S.photos.length>40)S.photos.length=40;save();toast('انحفظت الصورة في الصور')}
function importPhotos(files){const list=[...files].slice(0,20);let left=list.length;if(!left)return;
 list.forEach(f=>{const img=new Image();img.onload=()=>{S.photos.unshift({id:uid(),d:shrink(img,img.naturalWidth,img.naturalHeight).toDataURL('image/jpeg',.8),t:now()});URL.revokeObjectURL(img.src);done()};img.onerror=done;img.src=URL.createObjectURL(f)});
 function done(){if(--left)return;if(S.photos.length>60)S.photos.length=60;save();toast(list.length>1?'انضافت '+list.length+' صور':'انضافت الصورة');if(cur==='photos')APPS.photos()}}
$('#f-photo').onchange=e=>{importPhotos(e.target.files);e.target.value=''};
$('#f-cam').onchange=e=>{importPhotos(e.target.files);e.target.value=''};
APPS.camera=function(){
 page({t:'الكاميرا',h:`<div class="viewfinder" id="vf"><span>جارٍ تشغيل الكاميرا…</span></div><button class="shutter" id="shut" aria-label="التقاط صورة"></button><p class="hint" style="text-align:center;margin-top:10px">الكاميرا ما اشتغلت؟ <button class="link" id="pick">اختر صورة من جهازك</button></p>`});
 let stream=null,video=null,alive=true;cleanups.push(()=>{alive=false;stream&&stream.getTracks().forEach(t=>t.stop())});
 if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(s=>{if(!alive){s.getTracks().forEach(t=>t.stop());return}stream=s;video=document.createElement('video');video.playsInline=true;video.muted=true;video.srcObject=s;video.style.cssText='width:100%;height:100%;object-fit:cover';const vf=$('#vf');vf.innerHTML='';vf.appendChild(video);video.play()}).catch(()=>{const vf=$('#vf');if(vf)vf.innerHTML='<span>الكاميرا مو متاحة، اضغط الزر لاختيار صورة</span>'})}
 else $('#vf').innerHTML='<span>الكاميرا مو متاحة، اضغط الزر لاختيار صورة</span>';
 $('#shut').onclick=()=>{if(!video||!video.videoWidth){$('#f-cam').click();return}const c=shrink(video,video.videoWidth,video.videoHeight);addPhoto(c.toDataURL('image/jpeg',.8));const vf=$('#vf');vf.style.opacity=.2;setTimeout(()=>vf.style.opacity=1,120);beep(1400,.05,.08)};
 $('#pick').onclick=()=>$('#f-photo').click();
};
APPS.photos=function(){
 page({t:'الصور',h:`<div class="rowx" style="margin-bottom:10px"><button class="btn sm" data-add>إضافة من مكتبة الصور</button><span class="hint">${S.photos.length} صورة</span></div>`+(S.photos.length?`<div class="photos">${S.photos.map(p=>`<button data-ph="${p.id}" style="background-image:url(${p.d})" aria-label="صورة"></button>`).join('')}</div>`:empty('ما فيه صور','صوّر من الكاميرا أو أضف صورة من جهازك')),
 on:e=>{const t=e.target.closest('button');if(!t)return;if('add' in t.dataset)$('#f-photo').click();if(t.dataset.ph)viewPhoto(t.dataset.ph)}});
};
function viewPhoto(id){const p=S.photos.find(x=>x.id===id);if(!p)return;const pn=sheet(`<img src="${p.d}" alt="" style="width:100%;border-radius:14px;display:block"><p class="hint" style="margin:8px 0">${new Date(p.t).toLocaleString('ar-SA-u-nu-latn')}</p><div class="rowx"><button class="btn" id="pd">إرسال للديسكورد</button><button class="btn red" id="px">حذف</button></div>`);
 pn.querySelector('#pd').onclick=async()=>{if(!hook()){toast('أضف رابط Webhook من الإعدادات أول');return}const b=await (await fetch(p.d)).blob();const ok=await discord('📸 صورة جديدة',b);toast(ok?'انرسلت للديسكورد':'ما قدرنا نرسل، تأكد من الرابط')};
 pn.querySelector('#px').onclick=()=>{S.photos=S.photos.filter(x=>x.id!==id);save();closeSheet();APPS.photos()}}

 on:e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.mb){mailBox=d.mb;APPS.mail()}if(d.m)readMail(d.m);if('new' in d)composeMail()}});

/* ========== الساعة ========== */
let clockTab='now',sw={run:0,start:0,acc:0,laps:[]},tmr={end:0,id:null};
const fmtMs=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)+'.'+pad(Math.floor(ms%1000/10))};
APPS.clock=function(){let h=tabs([['now','الساعة'],['sw','ساعة الإيقاف'],['tm','المؤقت']],clockTab,'data-ct');
 if(clockTab==='now')h+=`<div class="big" id="bc"></div><div style="text-align:center;color:var(--app-muted)">${new Date().toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'})}</div><div class="sec">مدن العالم</div><div class="list" id="wc"></div>`;
 if(clockTab==='sw')h+=`<div class="big" id="swd">00:00.00</div><div class="rowx" style="justify-content:center;margin:10px 0"><button class="btn ${sw.run?'red':'green'}" data-sw>${sw.run?'إيقاف':'بدء'}</button><button class="btn ghost" data-lap>${sw.run?'لفة':'تصفير'}</button></div><div class="list" id="laps"></div>`;
 if(clockTab==='tm')h+=tmr.end>now()?`<div class="big" id="tmd"></div><div style="text-align:center"><button class="btn red" data-tc>إلغاء المؤقت</button></div>`:`<div class="stack" style="margin-top:20px"><label class="lb" for="tmin">الدقائق</label><input class="inp ltr" id="tmin" type="number" min="0" value="1"><label class="lb" for="tsec">الثواني</label><input class="inp ltr" id="tsec" type="number" min="0" max="59" value="0"><button class="btn green" data-ts>تشغيل</button></div>`;
 page({t:'الساعة',h,on:e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.ct){clockTab=d.ct;APPS.clock()}
  if('sw' in d){if(sw.run){sw.acc+=now()-sw.start;sw.run=0}else{sw.start=now();sw.run=1}APPS.clock()}
  if('lap' in d){if(sw.run)sw.laps.unshift(sw.acc+now()-sw.start);else sw={run:0,start:0,acc:0,laps:[]};APPS.clock()}
  if('ts' in d){const ms=((+$('#tmin').value||0)*60+(+$('#tsec').value||0))*1000;if(ms<=0)return;tmr.end=now()+ms;clearTimeout(tmr.id);tmr.id=setTimeout(()=>{tmr.end=0;for(let i=0;i<4;i++)setTimeout(()=>beep(1000,.25,.2),i*350);banner('clock','المؤقت','انتهى الوقت',()=>openApp('clock'));if(cur==='clock')APPS.clock()},ms);APPS.clock()}
  if('tc' in d){clearTimeout(tmr.id);tmr.end=0;APPS.clock()}
 }});
 const upd=()=>{const bc=$('#bc');if(bc){const d=new Date();bc.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
   const wc=$('#wc');if(wc&&!wc.dataset.f){wc.dataset.f=1;wc.innerHTML=[['مكة',3],['دبي',4],['لندن',0],['نيويورك',-5],['طوكيو',9]].map(([c,o])=>{const u=new Date(Date.now()+d.getTimezoneOffset()*6e4+o*36e5);return `<div class="row"><div class="main"><div class="t">${c}</div><div class="s">UTC${o>=0?'+':''}${o}</div></div><div class="ltr" style="font-size:24px;font-weight:300">${pad(u.getHours())}:${pad(u.getMinutes())}</div></div>`}).join('')}}
  const sd=$('#swd');if(sd){sd.textContent=fmtMs(sw.acc+(sw.run?now()-sw.start:0));const lp=$('#laps');if(lp&&lp.childElementCount!==sw.laps.length)lp.innerHTML=sw.laps.map((l,i)=>`<div class="row"><div class="main">لفة ${sw.laps.length-i}</div><div class="ltr">${fmtMs(l)}</div></div>`).join('')}
  const td=$('#tmd');if(td){const r=Math.max(0,tmr.end-now());td.textContent=pad(Math.floor(r/60000))+':'+pad(Math.ceil(r%60000/1000)%60)}};
 upd();const iv=setInterval(upd,50);cleanups.push(()=>clearInterval(iv));
};

function dist(p,from=mapMe){return (Math.abs(p.x-from.x)+Math.abs(p.y-from.y))*6}
function drawMap(){const c=$('#mc');if(!c)return;const W=c.clientWidth,H=W,dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
 x.fillStyle='#e9e4d8';x.fillRect(0,0,W,H);
 x.fillStyle='#a8d5a2';x.beginPath();x.ellipse(W*.32,H*.42,W*.1,H*.08,.3,0,7);x.fill();
 x.fillStyle='#9cc9ef';x.beginPath();x.moveTo(W*.6,H);x.bezierCurveTo(W*.65,H*.75,W*.55,H*.65,W*.7,H*.58);x.lineTo(W*.75,H*.62);x.bezierCurveTo(W*.62,H*.7,W*.72,H*.8,W*.68,H);x.fill();
 x.strokeStyle='#fff';x.lineCap='round';
 for(let i=1;i<10;i++){x.lineWidth=i%3===0?7:3.5;x.beginPath();x.moveTo(0,H*i/10);x.lineTo(W,H*i/10);x.stroke();x.beginPath();x.moveTo(W*i/10,0);x.lineTo(W*i/10,H);x.stroke()}
 x.strokeStyle='#f6c560';x.lineWidth=5;x.beginPath();x.moveTo(0,H*.3);x.lineTo(W,H*.3);x.stroke();x.beginPath();x.moveTo(W*.6,0);x.lineTo(W*.6,H);x.stroke();
 if(mapDest){x.strokeStyle='#0a84ff';x.lineWidth=5;x.setLineDash([]);x.beginPath();x.moveTo(mapMe.x*W,mapMe.y*H);x.lineTo(mapDest.x*W,mapMe.y*H);x.lineTo(mapDest.x*W,mapDest.y*H);x.stroke()}
 PLACES.concat(mapDest&&!PLACES.includes(mapDest)?[mapDest]:[]).forEach(p=>{x.fillStyle=p.c;x.beginPath();x.arc(p.x*W,p.y*H,p===mapDest?9:6.5,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.fillStyle='#1f2937';x.font='600 11px "IBM Plex Sans Arabic",sans-serif';x.textAlign='center';x.fillText(p.n,Math.min(W-30,Math.max(30,p.x*W)),p.y*H-12)});
 x.fillStyle='rgba(10,132,255,.25)';x.beginPath();x.arc(mapMe.x*W,mapMe.y*H,16,0,7);x.fill();x.fillStyle='#0a84ff';x.beginPath();x.arc(mapMe.x*W,mapMe.y*H,7,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2.5;x.stroke();
 const r=$('#route');if(r&&mapDest){const d=dist(mapDest);r.innerHTML=`<div class="rowx" style="justify-content:space-between"><div><div class="t">${esc(mapDest.n)}</div><div class="s">${d.toFixed(1)} كم · ${Math.max(1,Math.round(d/40*60))} دقيقة بالسيارة</div></div><button class="btn sm green" id="go">انطلق</button></div>`;$('#go').onclick=()=>{const tgt=mapDest;let k=0;const from={...mapMe};const iv=setInterval(()=>{k+=.05;mapMe=k<.5?{x:from.x+(tgt.x-from.x)*k*2,y:from.y}:{x:tgt.x,y:from.y+(tgt.y-from.y)*(k-.5)*2};if(k>=1){clearInterval(iv);mapMe={x:tgt.x,y:tgt.y};mapDest=null;toast('وصلت إلى '+tgt.n);if(cur==='maps')APPS.maps();return}drawMap()},60);cleanups.push(()=>{clearInterval(iv)})}}}

const CITIES=['الرياض','جدة','الدمام','أبها','مكة'];let wCity=0;
function seeded(n){let s=n%2147483647||1;return()=>{s=s*16807%2147483647;return s/2147483647}}
APPS.weather=function(){const d=new Date(),R=seeded(d.getFullYear()*1000+d.getMonth()*40+d.getDate()+wCity*7919);
 const base=[29,31,30,22,33][wCity],conds=[['مشمس','☀️'],['غائم جزئياً','⛅'],['غائم','☁️'],['غبار','🌫️'],['زخات مطر','🌦️']];
 const cnd=conds[Math.floor(R()*(wCity===3?5:3.5))],tmp=Math.round(base+R()*4);
 const hrs=Array.from({length:12},(_,i)=>{const h=(d.getHours()+i)%24;return [i?pad(h):'الآن',Math.round(tmp-Math.abs(14-h)*.5+R()*2)]});
 const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 page({t:'الطقس',h:`<select class="inp" id="wc" style="margin-bottom:12px">${CITIES.map((c,i)=>`<option value="${i}" ${i===wCity?'selected':''}>${c}</option>`).join('')}</select><div class="wx"><div style="font-size:22px;font-weight:600">${CITIES[wCity]}</div><div class="tmp">${tmp}°</div><div>${cnd[1]} ${cnd[0]}</div><div style="opacity:.85;margin-top:4px">العظمى ${tmp+4}° · الصغرى ${tmp-8}°</div><div class="hours">${hrs.map(([h,t])=>`<div>${h}<br><span style="font-size:18px">${t}°</span></div>`).join('')}</div></div><div class="sec">الأيام القادمة</div><div class="list">${Array.from({length:6},(_,i)=>{const t=Math.round(tmp+R()*4-2);return `<div class="row"><div class="main t">${i?days[(d.getDay()+i)%7]:'اليوم'}</div><span>${conds[Math.floor(R()*3)][1]}</span><div class="ltr" style="width:90px">${t-8}° / ${t+4}°</div></div>`}).join('')}</div><p class="hint" style="margin-top:10px">بيانات طقس تجريبية داخل اللعبة.</p>`});
 $('#wc').onchange=e=>{wCity=+e.target.value;APPS.weather()};
};

/* ========== الموسيقى ========== */
const TRACKS=[{n:'ليل المدينة',a:'فرقة الحي',c:['#7c3aed','#db2777'],bpm:92,root:220,sc:[0,3,5,7,10],seed:11},{n:'طريق الساحل',a:'نوّار',c:['#0ea5e9','#22c55e'],bpm:110,root:262,sc:[0,2,4,7,9],seed:23},{n:'غبار الصحراء',a:'رمال',c:['#f59e0b','#b45309'],bpm:84,root:196,sc:[0,1,4,5,7,8],seed:37},{n:'سهرة',a:'ضي',c:['#ec4899','#6366f1'],bpm:120,root:247,sc:[0,3,5,6,7,10],seed:51}];
const MP={i:0,on:0,start:0,off:0,master:null,end:null};
const tLen=t=>64*60/t.bpm/2;
function mpPlay(){const c=actx(),t=TRACKS[MP.i],st=60/t.bpm/2,R=seeded(t.seed),m=c.createGain();m.gain.value=.18;m.connect(c.destination);MP.master=m;
 const notes=Array.from({length:64},()=>t.sc[Math.floor(R()*t.sc.length)]+(R()<.25?12:0));const t0=c.currentTime-MP.off;
 notes.forEach((n,k)=>{const at=t0+k*st;if(at<c.currentTime-.01)return;if(k%2&&R()<.3)return;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=t.root*Math.pow(2,n/12);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.5,at+.02);g.gain.exponentialRampToValueAtTime(.001,at+st*1.8);o.connect(g).connect(m);o.start(at);o.stop(at+st*2);
  if(k%4===0){const b=c.createOscillator(),bg=c.createGain();b.type='sine';b.frequency.value=t.root/2*Math.pow(2,t.sc[(k/4)%t.sc.length]/12);bg.gain.setValueAtTime(.6,at);bg.gain.exponentialRampToValueAtTime(.001,at+st*3.5);b.connect(bg).connect(m);b.start(at);b.stop(at+st*4)}});
 MP.start=t0;MP.on=1;clearTimeout(MP.end);MP.end=setTimeout(()=>mpSkip(1),(tLen(t)-MP.off)*1000)}
function mpStop(){if(MP.master){MP.master.disconnect();MP.master=null}clearTimeout(MP.end);if(MP.on)MP.off=actx().currentTime-MP.start;MP.on=0}
function mpSkip(d){mpStop();MP.i=(MP.i+d+TRACKS.length)%TRACKS.length;MP.off=0;mpPlay();if(cur==='music')APPS.music()}
const ic={play:'<svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',pause:'<svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',prev:'<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3 7 10 7V5z"/></svg>',next:'<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 19l10-7L5 5z"/></svg>'};
APPS.music=function(){const t=TRACKS[MP.i];
 page({t:'الموسيقى',h:`<div class="art" style="background:linear-gradient(135deg,${t.c[0]},${t.c[1]})">${I.music.replace('<svg','<svg width="90" height="90" style="opacity:.9;border-radius:20px"')}</div><div style="text-align:center"><div class="t" style="font-size:20px">${t.n}</div><div class="s">${t.a}</div></div><div class="prog" style="margin-top:14px"><i id="pg"></i></div><div class="ctrl"><button data-c="-1" aria-label="السابق">${ic.prev}</button><button data-c="0" aria-label="تشغيل">${MP.on?ic.pause:ic.play}</button><button data-c="1" aria-label="التالي">${ic.next}</button></div><div class="sec">قائمة التشغيل</div><div class="list">${TRACKS.map((x,i)=>`<button class="row" data-tr="${i}"><div style="width:42px;height:42px;border-radius:8px;flex:none;background:linear-gradient(135deg,${x.c[0]},${x.c[1]})"></div><div class="main"><div class="t" style="${i===MP.i?'color:#ff375f':''}">${x.n}</div><div class="s">${x.a}</div></div><div class="meta">${Math.floor(tLen(x)/60)}:${pad(Math.round(tLen(x)%60))}</div></button>`).join('')}</div>`,
 on:e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.c==='0'){MP.on?mpStop():mpPlay();APPS.music()}else if(d.c)mpSkip(+d.c);if(d.tr){mpStop();MP.i=+d.tr;MP.off=0;mpPlay();APPS.music()}}});
 const iv=setInterval(()=>{const pg=$('#pg');if(!pg)return;const p=MP.on?(actx().currentTime-MP.start):MP.off;pg.style.width=Math.min(100,p/tLen(TRACKS[MP.i])*100)+'%'},200);cleanups.push(()=>clearInterval(iv));
};

function saveMemo(d,dur){S.memos.unshift({id:uid(),n:'تسجيل جديد '+(S.memos.length+1),d,t:now(),dur});save();if(cur==='voice')APPS.voice()}

   r.onstop=()=>{s.getTracks().forEach(t=>t.stop());clearInterval(REC.iv);const dur=Math.round((now()-st)/1000);REC=null;const fr=new FileReader();fr.onload=()=>saveMemo(fr.result,dur);fr.readAsDataURL(new Blob(ch,{type:r.mimeType||'audio/webm'}))};
   r.start();REC.iv=setInterval(()=>{const el=$('#rt');if(el){const s2=Math.floor((now()-st)/1000);el.textContent=pad(Math.floor(s2/60))+':'+pad(s2%60)}},250);APPS.voice()

/* ========== الآلة الحاسبة ========== */
APPS.calc=function(){
 page({t:'الآلة الحاسبة',h:`<div class="calc"><div class="out" id="out">0</div><div class="keys" id="keys"></div></div>`});VB.style.display='flex';cleanups.push(()=>VB.style.display='');
 const ks=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],['.'],['=','op']];
 let v='0',prev=null,op=null,fresh=false;const out=$('#out');
 const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;
 const show=()=>{out.textContent=isNaN(+v)?'خطأ':(+v).toLocaleString('en-US',{maximumFractionDigits:8})+(v.endsWith('.')?'.':'')};
 ks.forEach(([t,c])=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=()=>{
  if(/\d/.test(t)){v=(fresh||v==='0')?t:v+t;fresh=false}
  else if(t==='.'){if(fresh){v='0.';fresh=false}else if(!v.includes('.'))v+='.'}
  else if(t==='AC'){v='0';prev=null;op=null}
  else if(t==='±')v=String(-v);
  else if(t==='%')v=String(v/100);
  else if(t==='='){if(op!==null){v=String(calc(prev,+v,op));op=null;fresh=true}}
  else{if(op!==null&&!fresh)v=String(calc(prev,+v,op));prev=+v;op=t;fresh=true}
  show()};$('#keys').appendChild(b)});
};

/* ========== دورك شات ========== */
APPS.chat=function(){const rs=Object.keys(S.rooms);
 page({t:'دورك شات',h:`<div class="list">${rs.map(r=>{const m=S.rooms[r].at(-1);return `<button class="row" data-r="${esc(r)}"><div class="av" style="background:#1c1c1e;border:1px solid var(--line)">#</div><div class="main"><div class="t">${esc(r)}</div><div class="s">${m?esc(m.by+': '+m.x):'ما فيه رسائل'}</div></div><div class="meta">${m?dayhm(m.t):''}</div></button>`}).join('')}</div><form class="compose" id="fr" style="margin-top:14px"><input class="inp" id="rn" placeholder="اسم غرفة جديدة" required><button class="btn">إنشاء</button></form>`,
 on:e=>{const b=e.target.closest('[data-r]');if(b)room(b.dataset.r)}});
 $('#fr').onsubmit=e=>{e.preventDefault();const n=$('#rn').value.trim();if(n&&!S.rooms[n]){S.rooms[n]=[];save()}room(n)};
};
const cmsg=m=>`<div class="post" style="padding:8px 0;border:0">${avatar(m.by)}<div class="body"><div><span class="t">${esc(m.by)}</span> <span class="s" style="display:inline">${hm(m.t)}</span></div><div class="txt" style="margin:2px 0">${esc(m.x)}</div></div></div>`;
function room(r){page({t:'# '+r,h:`<div id="thr">${S.rooms[r].map(cmsg).join('')||empty('الغرفة فاضية','كن أول واحد يكتب')}</div>`,f:`<form class="compose" id="cr"><input class="inp" id="crx" placeholder="اكتب في #${esc(r)}" autocomplete="off"><button class="btn">إرسال</button></form>`,back:APPS.chat});curRoom=r;VB.scrollTop=1e9;
 $('#cr').onsubmit=e=>{e.preventDefault();const x=$('#crx').value.trim();if(!x)return;$('#crx').value='';const m={by:me(),x,t:now()};S.rooms[r].push(m);save();if(S.rooms[r].length===1)$('#thr').innerHTML='';$('#thr').insertAdjacentHTML('beforeend',cmsg(m));VB.scrollTop=1e9;discord(`💬 [#${r}] ${me()}: ${x}`);}}

/* ========== ترندي ========== */
const TC=[['#f43f5e','#7c3aed'],['#0ea5e9','#1e3a8a'],['#f59e0b','#be123c'],['#10b981','#0f766e'],['#111827','#4b5563']];
const heart='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21 3.5 12.6A5 5 0 0 1 12 6a5 5 0 0 1 8.5 6.6Z"/></svg>';
APPS.trendy=function(){
 page({t:'ترندي',h:`<button class="btn block" data-new style="margin-bottom:12px">نشر ترند</button>`+[...S.cards].sort((a,b)=>b.t-a.t).map(k=>`<div class="tcard" style="background:linear-gradient(160deg,${TC[k.c][0]},${TC[k.c][1]})"><div class="tt">${esc(k.x)}</div><div class="rowx" style="justify-content:space-between"><span style="font-weight:600">@${esc(k.by)} · ${dayhm(k.t)}</span><span class="rowx">${k.by===me()?`<button class="like" style="color:#fff" data-x="${k.id}">حذف</button>`:''}<button class="like ${k.liked?'on':''}" style="${k.liked?'':'color:#fff'}" data-l="${k.id}">${heart} ${k.likes}</button></span></div></div>`).join(''),
 on:e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.l){const k=S.cards.find(x=>x.id===d.l);k.liked=!k.liked;k.likes+=k.liked?1:-1;save();APPS.trendy()}
  if(d.x){S.cards=S.cards.filter(x=>x.id!==d.x);save();APPS.trendy()}
  if('new' in d){let c=0;const p=sheet(`<h3>ترند جديد</h3><form class="stack" id="ft"><textarea class="inp" id="tx" rows="3" maxlength="140" required placeholder="وش الترند؟"></textarea><div class="swatches">${TC.map((g,i)=>`<button type="button" class="sw ${i?'':'on'}" data-c="${i}" style="background:linear-gradient(135deg,${g[0]},${g[1]})" aria-label="لون"></button>`).join('')}</div><button class="btn">نشر</button></form>`);
   p.onclick=e=>{const s=e.target.closest('[data-c]');if(s){c=+s.dataset.c;p.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===s))}};
   p.querySelector('#ft').onsubmit=e=>{e.preventDefault();const x=$('#tx').value.trim();S.cards.push({id:uid(),by:me(),x,c,t:now(),likes:0,liked:0});save();closeSheet();discord(`🎵 ترند جديد من ${me()}: ${x}`);APPS.trendy()}}
 }});
};

/* ========== بيردي ========== */
const an=n=>{n=Number(n)||0;if(n>=1e6)return (n/1e6).toLocaleString('ar-SA',{maximumFractionDigits:1})+'مليون';if(n>=1e3)return (n/1e3).toLocaleString('ar-SA',{maximumFractionDigits:n<1e4?1:0})+'ألف';return n.toLocaleString('ar-SA')};
const rel=t=>{const s=(now()-t)/1000;if(s<60)return 'الآن';if(s<3600)return an(Math.floor(s/60))+' د';if(s<86400)return an(Math.floor(s/3600))+' س';return an(Math.floor(s/86400))+' ي'};
const BI={
 reply:'<path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-4.2A8.5 8.5 0 1 1 20.5 11.5Z"/>',
 rt:'<path d="M17 3l3.5 3.5L17 10"/><path d="M3.5 12V9.5a3 3 0 0 1 3-3h14"/><path d="M7 21l-3.5-3.5L7 14"/><path d="M20.5 12v2.5a3 3 0 0 1-3 3h-14"/>',
 like:'<path d="M12 20.5C6.5 16 3 12.8 3 9a4.4 4.4 0 0 1 9-1.3A4.4 4.4 0 0 1 21 9c0 3.8-3.5 7-9 11.5Z"/>',
 views:'<path d="M5 20v-8M10 20V5M15 20v-11M20 20v-6"/>',
 bm:'<path d="M6 3.5h12v17l-6-4.2-6 4.2Z"/>',
 share:'<path d="M12 3.5v12M7.5 8 12 3.5 16.5 8"/><path d="M4.5 14v6h15v-6"/>',
 more:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
 home:'<path d="M3 10.5 12 3l9 7.5V21h-6.5v-6.5h-5V21H3Z" fill="currentColor"/>',
 search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>',

 img:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
 back:'<path d="M10 5l7 7-7 7M17 12H4"/>',
 badge:'<path d="M12 2.5 14.6 4.4 17.8 4.3 18.8 7.3 21.5 9.2 20.5 12.2 21.5 15.2 18.8 17 17.8 20 14.6 20 12 22 9.4 20 6.2 20 5.2 17 2.5 15.2 3.5 12.2 2.5 9.2 5.2 7.3 6.2 4.3 9.4 4.4Z" fill="#1d9bf0" stroke="none"/><path d="m8.5 12.3 2.4 2.4 4.8-5" stroke="#fff" stroke-width="2"/>'
};
const bsv=(k,s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${BI[k]}</svg>`;
let bTab='for',bNav='home',bQuery='';
const bAv=(p,sz=42)=>p.av?`<img class="bav" src="${esc(p.av)}" alt="" style="width:${sz}px;height:${sz}px">`:`<div class="av" style="width:${sz}px;height:${sz}px;background:hsl(${hue(p.by)} 50% 40%)">${esc(String(p.by)[0]||'?')}</div>`;
const mine=p=>S.dc&&p.uid===S.dc.id;
function bPost(p,detail){p.views=(p.views||0)+1;
 return `<article class="bp${detail?' detail':''}" data-open="${p.id}">${bAv(p)}<div class="bpb"><div class="bph"><span class="bn">${esc(p.by)}</span>${p.ver?bsv('badge',17):''}<span class="bm ltrs">@${esc(p.handle||'user')}</span><span class="bm">· ${rel(p.t)}</span><button class="bic more" data-more="${p.id}" aria-label="المزيد">${bsv('more',18)}</button></div>
 <div class="btx">${esc(p.x)}</div>${p.img?`<img class="bimg" src="${p.img}" alt="">`:''}
 <div class="bact"><button class="bic" data-rep="${p.id}" aria-label="رد">${bsv('reply')}<span>${p.replies&&p.replies.length?an(p.replies.length):''}</span></button><button class="bic g ${p.rted?'on':''}" data-rt="${p.id}" aria-label="إعادة نشر">${bsv('rt')}<span>${p.rt?an(p.rt):''}</span></button><button class="bic r ${p.liked?'on':''}" data-lk="${p.id}" aria-label="إعجاب">${p.liked?bsv('like').replace('fill="none"','fill="currentColor"'):bsv('like')}<span>${p.likes?an(p.likes):''}</span></button><span class="bic">${bsv('views')}<span>${an(p.views)}</span></span><span class="rowx" style="gap:14px"><button class="bic ${p.bm?'on b':''}" data-bm="${p.id}" aria-label="حفظ">${p.bm?bsv('bm').replace('fill="none"','fill="currentColor"'):bsv('bm')}</button><button class="bic" data-sh="${p.id}" aria-label="مشاركة">${bsv('share')}</button></span></div></div></article>`}
const bNavBar=()=>`<div class="bfab-wrap"><button class="bfab" id="bfab" aria-label="منشور جديد"><svg width="26" height="26" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div><nav class="bnav">${[['home','home','الرئيسية'],['search','search','بحث'],['explore','explore','استكشاف'],['bell','bell','التنبيهات'],['mail','mail','الرسائل']].map(([k,i,l])=>`<button class="${bNav===k?'on':''}" data-nav="${k}" aria-label="${l}">${bsv(i,26)}</button>`).join('')}</nav>`;
APPS.birdy=function(){
 const meP={by:me(),av:S.dc&&S.dc.av};
 let list=[...S.posts].sort((a,b)=>b.t-a.t),head='',body='';
 if(bNav==='home'){
  if(bTab==='follow')list=list.filter(mine);
  if(bTab==='saved')list=list.filter(p=>p.bm);
  head=`<div class="bhr">${bAv(meP,34)}<div class="blogo">${I.birdy.replace('<svg','<svg width="30" height="30"')}</div><span style="width:34px"></span></div><div class="btabs">${[['for','لك'],['follow','منشوراتي'],['saved','المحفوظات']].map(([k,n])=>`<button data-bt="${k}" class="${bTab===k?'on':''}">${n}</button>`).join('')}</div>`;
  body=list.length?list.map(p=>bPost(p)).join(''):`<div class="bempty"><b>${bTab==='saved'?'ما حفظت شي للحين':'ما فيه منشورات للحين'}</b>اضغط زر + تحت وانشر أول منشور.</div>`;
 }else if(bNav==='search'){
  head=`<div class="bhr" style="gap:10px">${bAv(meP,34)}<input class="bsearch" id="bq" placeholder="بحث" value="${esc(bQuery)}"></div>`;
  const q=bQuery.trim();const r=q?list.filter(p=>p.x.includes(q)||p.by.includes(q)):[];
  body=q?(r.length?r.map(p=>bPost(p)).join(''):`<div class="bempty"><b>ما فيه نتائج</b>جرّب كلمة ثانية.</div>`):`<div class="bempty"><b>ابحث في المنشورات</b>اكتب كلمة أو اسم.</div>`;
 }else if(bNav==='explore'){
  const words={};list.forEach(p=>(p.x.match(/[#][^\s#]+|[؀-ۿ]{4,}/g)||[]).forEach(w=>words[w]=(words[w]||0)+1));
  const top=Object.entries(words).sort((a,b)=>b[1]-a[1]).slice(0,10);
  head=`<div class="bhr"><span class="bn" style="font-size:19px">استكشاف</span></div>`;
  body=top.length?top.map(([w,c],i)=>`<button class="btrend" data-q="${esc(w)}"><span class="bm">${an(i+1)} · رائج</span><span class="bn">${esc(w)}</span><span class="bm">${an(c)} منشور</span></button>`).join(''):`<div class="bempty"><b>ما فيه شي رائج</b>الكلمات اللي تتكرر في المنشورات تطلع هنا.</div>`;
 }else if(bNav==='bell'){
  const my=list.filter(mine).filter(p=>p.likes||p.rt||(p.replies&&p.replies.length));
  head=`<div class="bhr"><span class="bn" style="font-size:19px">التنبيهات</span></div>`;
  body=my.length?my.map(p=>`<button class="btrend" data-open2="${p.id}"><span class="bn">${bsv('like',18)} ${an(p.likes||0)} إعجاب · ${an(p.rt||0)} إعادة نشر · ${an((p.replies||[]).length)} رد</span><span class="bm">${esc(p.x.slice(0,80))}</span></button>`).join(''):`<div class="bempty"><b>ما فيه تنبيهات</b>التفاعل على منشوراتك يطلع هنا.</div>`;
 }
 page({t:'بيردي',bare:1,h:`<div class="bv"><header class="bhead">${head}</header>${body}</div>`,f:bNavBar(),on:bClick});
 const q=$('#bq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);q.oninput=()=>{bQuery=q.value;clearTimeout(q._t);q._t=setTimeout(APPS.birdy,250)}}
 $('#bfab').onclick=bCompose;
};
function bFind(id){return S.posts.find(p=>p.id===id)}
function bClick(e){const t=e.target.closest('button,[data-open]');if(!t)return;const d=t.dataset;
 if(d.nav){if(d.nav==='mail'){openApp('messages');return}bNav=d.nav;APPS.birdy();return}
 if(d.bt){bTab=d.bt;APPS.birdy();return}
 if(d.q){bQuery=d.q;bNav='search';APPS.birdy();return}
 if(d.open2){bDetail(d.open2);return}
 const p=bFind(d.lk||d.rt||d.bm||d.sh||d.rep||d.more||d.open);if(!p)return;
 if(d.lk){p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);save();t.classList.toggle('on',p.liked);t.innerHTML=(p.liked?bsv('like').replace('fill="none"','fill="currentColor"'):bsv('like'))+`<span>${p.likes?an(p.likes):''}</span>`;return}
 if(d.rt){p.rted=!p.rted;p.rt=(p.rt||0)+(p.rted?1:-1);save();t.classList.toggle('on',p.rted);t.querySelector('span').textContent=p.rt?an(p.rt):'';if(p.rted)discord(`🔁 ${me()} أعاد نشر منشور ${p.by}:\n${p.x}`);return}
 if(d.bm){p.bm=!p.bm;save();toast(p.bm?'انحفظ في المحفوظات':'انشال من المحفوظات');if(bTab==='saved')APPS.birdy();else{t.classList.toggle('on',p.bm);t.classList.toggle('b',p.bm);t.innerHTML=p.bm?bsv('bm').replace('fill="none"','fill="currentColor"'):bsv('bm')}return}
 if(d.sh){const pn=sheet(`<h3>مشاركة المنشور</h3><div class="stack"><button class="btn" id="sc">نسخ النص</button><button class="btn ghost" id="sd">إرسال لديسكورد</button></div>`);
  pn.querySelector('#sc').onclick=()=>{navigator.clipboard.writeText(p.x).then(()=>toast('انتسخ النص'),()=>toast('ما قدرنا ننسخ'));closeSheet()};
  pn.querySelector('#sd').onclick=async()=>{closeSheet();if(!hook()){toast('ما فيه رابط Webhook');return}await discord(`🐦 **${p.by}** (@${p.handle}):\n${p.x}`);toast('انرسل لديسكورد')};return}
 if(d.rep){bDetail(p.id,true);return}
 if(d.more){if(!mine(p)){toast('ما تقدر تعدّل منشور غيرك');return}ask('حذف المنشور؟',()=>{S.posts=S.posts.filter(x=>x.id!==p.id);save();APPS.birdy()},'حذف');return}
 if(d.open&&!e.target.closest('button')){bDetail(p.id)}
}
function bDetail(id,focus){const p=bFind(id);if(!p)return;
 page({t:'بيردي',bare:1,h:`<div class="bv"><header class="bhead"><div class="bhr" style="justify-content:flex-start;gap:18px"><button class="bic" id="bback" aria-label="رجوع">${bsv('back',22)}</button><span class="bn" style="font-size:19px">منشور</span></div></header>${bPost(p,1)}<div class="bsec">الردود</div>${(p.replies||[]).map(r=>`<div class="bp">${bAv(r,36)}<div class="bpb"><div class="bph"><span class="bn">${esc(r.by)}</span><span class="bm ltrs">@${esc(r.handle||'')}</span><span class="bm">· ${rel(r.t)}</span></div><div class="btx">${esc(r.x)}</div></div></div>`).join('')||'<div class="bempty" style="padding:24px">ما فيه ردود للحين.</div>'}</div>`,
  f:`<form class="breply" id="brf">${bAv({by:me(),av:S.dc&&S.dc.av},32)}<input id="brx" placeholder="انشر ردّك" autocomplete="off"><button class="bpost" ${''}>رد</button></form>`,back:APPS.birdy,on:bClick});
 $('#bback').onclick=APPS.birdy;const ip=$('#brx');if(focus)ip.focus();
 $('#brf').onsubmit=e=>{e.preventDefault();const x=ip.value.trim();if(!x)return;(p.replies=p.replies||[]).push({by:me(),handle:S.dc&&S.dc.user,av:S.dc&&S.dc.av,x,t:now()});save();discord(`↩️ **${me()}** رد على ${p.by}:\n${x}`);bDetail(id)}}
function bCompose(){let img=null;
 const pn=sheet(`<form id="bcf"><div class="rowx" style="justify-content:space-between;margin-bottom:12px"><button type="button" class="link" id="bcx" style="color:var(--app-fg)">إلغاء</button><button class="bpost" id="bcs" disabled>نشر</button></div><div class="rowx" style="align-items:flex-start">${bAv({by:me(),av:S.dc&&S.dc.av},40)}<textarea id="bct" maxlength="280" rows="5" placeholder="وش اللي يصير؟" class="bcta"></textarea></div><div id="bcimg"></div><div class="rowx" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:8px"><button type="button" class="bic" id="bci" style="color:#1d9bf0" aria-label="إضافة صورة">${bsv('img',22)}</button><span class="hint" id="bcc">٢٨٠</span></div></form>`);
 const ta=pn.querySelector('#bct'),sb=pn.querySelector('#bcs');ta.focus();
 ta.oninput=()=>{sb.disabled=!ta.value.trim()&&!img;$('#bcc').textContent=an(280-ta.value.length)};
 pn.querySelector('#bcx').onclick=closeSheet;
 const setImg=d=>{img=d;$('#bcimg').innerHTML=`<div style="position:relative"><img src="${img}" alt="" class="bimg" style="margin:10px 0 0"><button type="button" id="bcrm" aria-label="إزالة الصورة" style="position:absolute;top:18px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer">✕</button></div>`;$('#bcrm').onclick=()=>{img=null;$('#bcimg').innerHTML='';sb.disabled=!ta.value.trim()};sb.disabled=false};
 pn.querySelector('#bci').onclick=()=>{$('#bcimg').innerHTML=`<div class="sec" style="margin-top:10px">اختر من الصور</div>${S.photos.length?`<div class="photos" style="max-height:220px;overflow:auto">${S.photos.map(p=>`<button type="button" data-gp="${p.id}" style="background-image:url(${p.d})" aria-label="صورة"></button>`).join('')}</div>`:'<p class="hint">ما فيه صور في تطبيق الصور.</p>'}<button type="button" class="btn sm ghost" id="bcdev" style="margin-top:8px">من مكتبة صور جهازك</button>`;
  $('#bcimg').onclick=e=>{const g=e.target.closest('[data-gp]');if(g){const p=S.photos.find(x=>x.id===g.dataset.gp);if(p)setImg(p.d)}};
  $('#bcdev').onclick=()=>pickDev()};
 const pickDev=()=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const fl=f.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const d=shrink(im,im.naturalWidth,im.naturalHeight,800).toDataURL('image/jpeg',.75);URL.revokeObjectURL(im.src);setImg(d)};im.src=URL.createObjectURL(fl)};f.click()};
 pn.querySelector('#bcf').onsubmit=async e=>{e.preventDefault();const x=ta.value.trim();if(!x&&!img)return;
  const p={id:uid(),uid:S.dc&&S.dc.id,by:me(),handle:S.dc?S.dc.user:'user',av:S.dc&&S.dc.av,ver:1,x,img,t:now(),likes:0,liked:0,rt:0,rted:0,bm:0,views:0,replies:[]};
  S.posts.push(p);save();closeSheet();bNav='home';bTab='for';APPS.birdy();
  discord(`🐦 **${me()}** (@${p.handle}):\n${x}`,img?await (await fetch(img)).blob():null)}}

APPS.bank=function(){const canPay=now()-S.lastPay>10*60e3;
 page({t:'البنك',h:`<div class="bankcard"><div style="opacity:.85">الرصيد المتاح</div><div class="bal">${money(S.bal)}</div><div class="rowx" style="justify-content:space-between;opacity:.85;font-size:13px"><span>${esc(me())}</span><span class="ltr">IBAN SA•• ${esc(String(S.number).slice(-4))}</span></div></div>
 <div class="rowx" style="margin:12px 0"><button class="btn" data-tr style="flex:1">تحويل</button><button class="btn ghost" data-pay style="flex:1" ${canPay?'':'disabled'}>${canPay?'استلام الراتب':'الراتب بعد شوي'}</button></div>

/* ========== شبكة الجوال: اتصال ورسائل حقيقية بين الأجهزة ========== */
const PEER_PREFIX='cphone-'+'1539659625584918659'+'-';
const num4=id=>String(Number(BigInt(id)%9000n)+1000);
let peer=null,peerOk=false,call=null,conns={};
function netDot(){const el=$('#netst');if(el)el.innerHTML=peerOk?'<span class="chip g">متصل بالشبكة</span>':'<span class="chip o">جارٍ الاتصال بالشبكة…</span>'}
function startPeer(){
 if(!S.dc||peer||!window.Peer)return;
 peer=new Peer(PEER_PREFIX+S.number,{debug:0});
 peer.on('open',()=>{peerOk=true;netDot()});
 peer.on('disconnected',()=>{peerOk=false;netDot();setTimeout(()=>{if(peer&&!peer.destroyed)peer.reconnect()},3000)});
 peer.on('error',e=>{
  if(e.type==='unavailable-id'){toast('رقمك مفتوح في جهاز ثاني، سكّره وارجع');return}
  if(e.type==='peer-unavailable'){const n=(String(e.message).match(/(\d{4})\D*$/)||[])[1];if(call&&call.num===n&&!call.live){callStatus('الرقم مقفل أو مو متصل');setTimeout(endCall,2200)}if(n)failPending(n);return}
  if(['network','server-error','socket-error','socket-closed'].includes(e.type)){peerOk=false;netDot()}
 });
 peer.on('connection',c=>{const n=c.peer.slice(PEER_PREFIX.length);conns[n]=c;c.on('data',d=>gotData(n,d));c.on('close',()=>{if(conns[n]===c)delete conns[n]})});
 peer.on('call',incomingCall);
}
const pending={};
function failPending(n){(pending[n]||[]).forEach(m=>{m.st='fail'});delete pending[n];save();if(cur==='messages'&&curThread===n)thread(n);toast('ما وصلت، الرقم '+n+' مو متصل')}
function sendData(n,obj,msgRef){
 if(!peer||!peerOk){if(msgRef){msgRef.st='fail';save()}return false}
 let c=conns[n];
 const go=()=>{try{c.send(obj);if(msgRef){msgRef.st='ok';save();if(cur==='messages'&&curThread===n)thread(n)}}catch(e){}};
 if(c&&c.open){go();return true}
 if(!c){c=peer.connect(PEER_PREFIX+n,{reliable:true});conns[n]=c;c.on('data',d=>gotData(n,d));c.on('close',()=>{if(conns[n]===c)delete conns[n]})}
 if(msgRef)(pending[n]=pending[n]||[]).push(msgRef);
 c.on('open',()=>{(pending[n]||[]).forEach(m=>{m.st='ok'});delete pending[n];go()});
 setTimeout(()=>{if(!c.open){delete conns[n];if(pending[n])failPending(n)}},8000);
 return true}
function gotData(n,d){if(!d||typeof d!=='object')return;
 if(d.name){S.names=S.names||{};S.names[n]=String(d.name).slice(0,40)}
 if(d.t==='msg'){const m={me:0,t:now(),x:String(d.x).slice(0,1000)};(S.msgs[n]=S.msgs[n]||[]).push(m);
  if(cur==='messages'&&curThread===n)pushBubble(m);else{S.unread[n]=(S.unread[n]||0)+1;banner('messages',cname(n),m.x,()=>{openApp('messages');thread(n)});renderHome()}save()}
 if(d.t==='end'||d.t==='decline'||d.t==='busy'){if(call&&call.num===n){callStatus(d.t==='busy'?'الخط مشغول':d.t==='decline'?'رفض المكالمة':'انتهت المكالمة');setTimeout(endCall,1500)}}
}
function sendMsg(n,x){const m={me:1,t:now(),x,st:'wait'};(S.msgs[n]=S.msgs[n]||[]).push(m);save();pushBubble(m);sendData(n,{t:'msg',x,name:me()},m)}

/* ----- المكالمات ----- */
let ringIv=null;
function ringStart(inc){clearInterval(ringIv);const f=()=>inc?(beep(880,.25,.15),setTimeout(()=>beep(660,.3,.15),300)):beep(440,.9,.06);f();ringIv=setInterval(f,inc?1600:3000)}
function ringStop(){clearInterval(ringIv);ringIv=null}
function callStatus(t){const el=$('#cst');if(el)el.textContent=t}
function callUI(num,name,av,incoming){
 LY.querySelectorAll('.call').forEach(x=>x.remove());
 const d=document.createElement('div');d.className='call';d.id='callui';
 d.innerHTML=`${av?`<img src="${esc(av)}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover" onerror="this.style.visibility='hidden'">`:avatar(name)}<h3>${esc(name)}</h3><p class="ltr" style="direction:ltr">${esc(num)}</p><p id="cst" style="margin-top:6px">${incoming?'مكالمة واردة…':'جارٍ الاتصال…'}</p>
 <div class="acts">${incoming?`<button style="background:var(--good)" data-acc>رد</button><button style="background:var(--bad)" data-dec>رفض</button>`:`<button style="background:#3a3355" data-mute>كتم</button><button style="background:#3a3355" data-spk>السماعة</button><button style="background:var(--bad)" data-end>إنهاء</button>`}</div>`;
 LY.appendChild(d);
 d.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset;
  if('end' in k)hangUp();
  if('dec' in k){sendData(num,{t:'decline'});try{call.mc.close()}catch(_){}S.calls.unshift({num,t:now(),type:'miss'});save();endCall()}
  if('acc' in k)acceptCall();
  if('mute' in k&&call&&call.local){const tr=call.local.getAudioTracks()[0];tr.enabled=!tr.enabled;b.textContent=tr.enabled?'كتم':'مكتوم';b.style.background=tr.enabled?'#3a3355':'#fff';b.style.color=tr.enabled?'#fff':'#000'}
  if('spk' in k){const a=$('#ra');a.volume=a.volume<1?1:.5;b.textContent=a.volume<1?'السماعة':'سماعة عالية'}
 }}
function liveUI(){const d=$('#callui');if(!d)return;d.querySelector('.acts').innerHTML=`<button style="background:#3a3355" data-mute>كتم</button><button style="background:#3a3355" data-spk>السماعة</button><button style="background:var(--bad)" data-end>إنهاء</button>`;
 let s=0;callStatus('00:00');call.timer=setInterval(()=>{s++;callStatus(pad(Math.floor(s/60))+':'+pad(s%60))},1000)}
function playRemote(st){const a=$('#ra');a.srcObject=st;a.play().catch(()=>{})}
async function getMic(){try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false})}catch(e){toast('لازم تسمح للمايكروفون عشان المكالمات');return null}}
async function callScreen(num){
 num=String(num).replace(/\D/g,'');
 if(num.length!==4){toast('الرقم لازم يكون 4 أرقام');return}
 if(num===S.number){toast('هذا رقمك');return}
 if(call){toast('عندك مكالمة شغالة');return}
 if(!peerOk){toast('الجوال مو متصل بالشبكة، انتظر شوي');return}
 call={num,live:false};callUI(num,cname(num),null,false);ringStart(false);actx();
 S.calls.unshift({num,t:now(),type:'out'});save();
 const local=await getMic();if(!local||!call){ringStop();endCall();return}
 call.local=local;
 sendData(num,{t:'hello',name:me()});
 const mc=peer.call(PEER_PREFIX+num,local,{metadata:{from:S.number,name:me(),av:S.dc&&S.dc.av}});call.mc=mc;
 mc.on('stream',st=>{if(!call||call.live)return;call.live=true;ringStop();playRemote(st);liveUI()});
 mc.on('close',()=>{if(call&&call.mc===mc){callStatus('انتهت المكالمة');setTimeout(endCall,1200)}});
 mc.on('error',()=>{callStatus('تعذر الاتصال');setTimeout(endCall,1500)});
 call.noAns=setTimeout(()=>{if(call&&!call.live){sendData(num,{t:'end'});callStatus('ما في رد');setTimeout(endCall,1800)}},40000);
}
function incomingCall(mc){
 const n=mc.peer.slice(PEER_PREFIX.length),md=mc.metadata||{};
 if(md.name){S.names=S.names||{};S.names[n]=String(md.name).slice(0,40)}
 if(call){sendData(n,{t:'busy'});setTimeout(()=>{try{mc.close()}catch(e){}},500);S.calls.unshift({num:n,t:now(),type:'miss'});save();return}
 call={num:n,mc,live:false,incoming:true};
 callUI(n,cname(n),md.av,true);ringStart(true);
 mc.on('close',()=>{if(call&&call.mc===mc){if(!call.live){S.calls.unshift({num:n,t:now(),type:'miss'});save();banner('phone','مكالمة فائتة',cname(n),()=>openApp('phone'))}callStatus('انتهت المكالمة');setTimeout(endCall,1000)}});
 call.noAns=setTimeout(()=>{if(call&&call.mc===mc&&!call.live){S.calls.unshift({num:n,t:now(),type:'miss'});save();endCall()}},40000);
}
async function acceptCall(){if(!call||call.live)return;ringStop();actx();callStatus('جارٍ التوصيل…');
 const local=await getMic();if(!local||!call){sendData(call&&call.num,{t:'decline'});endCall();return}
 call.local=local;call.mc.answer(local);call.mc.on('stream',st=>{if(call.live)return;call.live=true;playRemote(st);liveUI()});
 S.calls.unshift({num:call.num,t:now(),type:'in'});save()}
function hangUp(){if(!call)return;sendData(call.num,{t:'end'});try{call.mc&&call.mc.close()}catch(e){}endCall()}
function endCall(){if(!call){LY.querySelectorAll('.call').forEach(x=>x.remove());return}ringStop();clearTimeout(call.noAns);clearInterval(call.timer);
 if(call.local)call.local.getTracks().forEach(t=>t.stop());const a=$('#ra');a.srcObject=null;call=null;
 LY.querySelectorAll('.call').forEach(x=>x.remove());if(cur==='phone')APPS.phone()}
addEventListener('beforeunload',()=>{if(call)hangUp();if(peer)peer.destroy()});

const PALS=[{bg:['#1a0f3d','#120a2a','#0c0720'],fr:['#5b2bb0','#3d1f8a','#6a2fc4','#4a22a0','#7b35d6','#5a29b5','#34197a','#4b23a8','#3a1c85'],tip:['#ff5a3c','#e0408f'],rib:'#8a5be0'},
 {bg:['#04213a','#062b45','#021524'],fr:['#0e6e8c','#0b4f6c','#138aa8','#0d5e7a','#16a0b8','#0f6f8a','#083a52','#0c5470','#0a4560'],tip:['#5eead4','#38bdf8'],rib:'#22d3ee'},
 {bg:['#3b0d0d','#2a0a12','#16060b'],fr:['#9f1239','#7f1d1d','#be123c','#881337','#e11d48','#9f1239','#5b0f1f','#7f1d1d','#6b1028'],tip:['#fbbf24','#fb923c'],rib:'#fb7185'}];
const cv=$('#wall'),cx=cv.getContext('2d');
function drawWall(){const P=PALS[S.wall]||PALS[0];const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(!r.width)return;
 cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height,R=seeded(7);
 const g=cx.createLinearGradient(0,0,W,H);g.addColorStop(0,P.bg[0]);g.addColorStop(.5,P.bg[1]);g.addColorStop(1,P.bg[2]);cx.fillStyle=g;cx.fillRect(0,0,W,H);
 const F=[[W*1.1,H*.25,-2.6,W*.9],[W*-.1,H*.1,.5,W*.8],[W*1.05,H*.55,-2.9,W],[W*-.15,H*.7,-.3,W*.9],[W*.6,H*1.1,-1.9,W*.9],[W*1.1,H*.95,-2.4,W*.8],[W*.2,H*-.05,1.2,W*.7],[W,H*.05,2.3,W*.6],[W*.3,H*.45,-.8,W*.6]];
 F.forEach(([x,y,a,len],fi)=>{const col=P.fr[fi],bend=(R()-.5)*.6,n=34;
  for(let i=4;i<n;i++){const t=i/n,ang=a+bend*t,px=x+Math.cos(a+bend*t*.5)*len*t,py=y+Math.sin(a+bend*t*.5)*len*t,ll=len*.32*Math.sin(Math.PI*t)+8;
   [1,-1].forEach(sd=>{const la=ang+sd*(1.05-.35*t),ex=px+Math.cos(la)*ll,ey=py+Math.sin(la)*ll,lg=cx.createLinearGradient(px,py,ex,ey);
    lg.addColorStop(0,col);lg.addColorStop(.7,col);lg.addColorStop(1,R()<.55?P.tip[0]:P.tip[1]);cx.strokeStyle=lg;cx.lineWidth=2.4+R()*1.6;cx.lineCap='round';cx.globalAlpha=.75;
    cx.beginPath();cx.moveTo(px,py);cx.quadraticCurveTo(px+Math.cos(la+sd*.2)*ll*.6,py+Math.sin(la+sd*.2)*ll*.6,ex,ey);cx.stroke()})}
  cx.globalAlpha=.6;cx.strokeStyle=P.rib;cx.lineWidth=2;cx.beginPath();cx.moveTo(x,y);for(let i=0;i<=20;i++){const t=i/20;cx.lineTo(x+Math.cos(a+bend*t*.5)*len*t,y+Math.sin(a+bend*t*.5)*len*t)}cx.stroke()});
 cx.globalAlpha=1;const v=cx.createRadialGradient(W/2,H/2,W*.2,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');cx.fillStyle=v;cx.fillRect(0,0,W,H)}
addEventListener('resize',()=>{drawWall();if(cur==='maps')drawMap()});

   if(DISCORD_GUILD_ID){const gr=await fetch('https://discord.com/api/users/@me/guilds',H);if(!gr.ok)throw 0;const gs=await gr.json();
    if(!gs.some(g=>g.id===DISCORD_GUILD_ID)){b.disabled=false;b.textContent='ربط حساب ديسكورد';lockErr('هذا الجوال لأعضاء السيرفر بس. ادخل السيرفر أول وبعدها اربط حسابك.');return}}
   const r=await fetch('https://discord.com/api/users/@me',H);if(!r.ok)throw 0;const u=await r.json();
   const def=Number((BigInt(u.id)>>22n)%6n);
   S.number=num4(u.id);S.dc={g:DISCORD_GUILD_ID,id:u.id,user:u.username,name:u.global_name||u.username,av:u.avatar?`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`:`https://cdn.discordapp.com/embed/avatars/${def}.png`,at:now()};save();
   b.disabled=false;b.textContent='ربط حساب ديسكورد';hideLock();
  }catch(e){b.disabled=false;b.textContent='ربط حساب ديسكورد';lockErr('ما قدرنا نجيب بيانات حسابك من ديسكورد، حاول مرة ثانية.')}
  return}
 if(!S.dc||S.dc.g!==DISCORD_GUILD_ID){S.dc=null;showLock()}
 else{if(!/^\d{4}$/.test(S.number)){S.number=num4(S.dc.id);save()}startPeer()}
}
renderHome();drawWall();bootAuth();
</script>
